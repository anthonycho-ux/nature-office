name: Agent Research Validation

on:
  pull_request:
    types: [opened, edited, reopened]
  push:
    branches: [master]

jobs:
  validate-research-requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Research Documentation
        run: |
          python scripts/validate_research_requirements.py

      - name: Run Research Validation Test
        run: |
          python -m pytest tests/test_research_requirements.py -v

      - name: Generate Research Report
        run: |
          python scripts/generate_research_report.py
        if: always()

      - name: Notify if Research Incomplete
        if: failure()
        run: |
          echo "Research validation failed. Please review:
          1. CONTRIBUTING.md for research requirements
          2. research/ directory for findings
          3. Code changes for new features
          4. Updated documentation"

  research-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Web Research Configuration
        run: |
          python -c "
          import os
          import yaml
          
          # Check if agent has web research tools configured
          if not os.path.exists('scripts/research_tools.py'):
              print('ERROR: research_tools.py not found')
              exit(1)
          
          # Check if research requirements are documented
          if not os.path.exists('CONTRIBUTING.md'):
              print('ERROR: CONTRIBUTING.md not found')
              exit(1)
          
          # Check if research findings are documented
          if not os.path.exists('research/'):
              print('ERROR: research/ directory not found')
              exit(1)
          
          print('✓ Research validation requirements found')
          "

  enforce-research-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Commit Message for Research
        run: |
          python scripts/validate_research_commit.py

      - name: Create Research Validation Summary
        run: |
          python scripts/create_research_summary.py
        if: always()